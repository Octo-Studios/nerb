architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/" + project.mod_id + ".accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modImplementation "it.hurts.shatterbyte.shatterlib:shatterlib-common:$rootProject.shatterlib_version"

    compileOnly "mezz.jei:jei-${minecraft_version}-common:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
}
